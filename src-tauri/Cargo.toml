[package]
name = "ccusage-gauge-dashboard"
version = "0.2.1"
edition = "2021"
description = "Native dashboard window hosted by ccusage-gauge"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
